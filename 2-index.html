<!DOCTYPE html>
<html lang="es">
<head>
<base target="_self">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservá tu turno · Paula Paciel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Montserrat:wght@300;400;500;600;700&family=Allura&family=Bebas+Neue&family=Yellowtail&family=Cutive+Mono&family=Kaushan+Script&display=swap">
<style>

:root{
  --bg:#F4EEE6; --surface:#FFFFFF; --ink:#2E3033; --muted:#6B6E73; --line:#E7DED3;
  --accent:#E0611F; --accent-2:#F59A4C; --accent-soft:#FCE8D9; --accent-ink:#FFFFFF;
  --ok:#2E8B57; --ok-soft:#E3F3EA; --warn:#B8650F; --warn-soft:#FDEBD3; --mp:#009EE3;
  --shadow:0 1px 2px rgba(46,48,51,.06),0 6px 18px rgba(46,48,51,.06);
  --display:"Bodoni Moda", "Didot", Georgia, serif;
  --body:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  --script:"Allura", "Snell Roundhand", cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;background:var(--surface);border-radius:20px;padding:22px 22px 20px;box-shadow:var(--shadow);border-bottom:4px solid var(--accent)}
.brand h1{font-family:var(--display);font-weight:700;font-size:2.3rem;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em;color:var(--ink)}
.brand .script{font-family:var(--script);font-size:1.8rem;color:var(--accent);line-height:1;display:block;margin-bottom:-2px}
.brand p{margin:8px 0 0;color:var(--accent);font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;font-weight:500}
.demo{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg);padding:4px 10px;border-radius:999px;font-weight:700}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:22px}
.tabs button{flex:1;border:0;background:transparent;color:var(--ink);font:600 .95rem var(--body);padding:10px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
button:focus-visible,input:focus-visible,.slot:focus-visible,.svc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0 0 4px;color:var(--ink)}
h3{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:700}
.sub{color:var(--muted);margin:0 0 16px;font-size:.9rem}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.svc{display:flex;box-shadow:var(--shadow);justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 14px;border-radius:12px;cursor:pointer;font:inherit}
.svc:hover{border-color:var(--accent);transform:translateY(-1px)}
.svc{transition:transform .15s,border-color .15s}
.svc b{display:block;font-weight:600}
.svc small{color:var(--muted)}
.price{font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.grouplabel{grid-column:1/-1;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px;font-weight:700}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.day{flex:0 0 62px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 0;text-align:center;cursor:pointer;font:inherit}
.day small{display:block;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}
.day b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day[aria-pressed="true"] small{color:var(--accent-ink)}
.day:disabled{opacity:.35;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.slot{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 0;font:600 .9rem var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.slot:hover{border-color:var(--accent);color:var(--accent)}
.summary{box-shadow:var(--shadow);border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;display:grid;gap:8px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;gap:12px}
.row span:first-child{color:var(--muted)}
.row.total{border-top:1px dashed var(--line);padding-top:8px;font-weight:700}
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-weight:600;font-size:.88rem}
input{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.btn{border:0;border-radius:999px;padding:14px 20px;font:700 .95rem var(--body);letter-spacing:.03em;cursor:pointer;background:linear-gradient(135deg,var(--accent-2),var(--accent));color:var(--accent-ink);box-shadow:0 6px 16px rgba(224,97,31,.28)}
.btn:hover{filter:brightness(1.05)}
.btn.mp{background:var(--mp);color:#FFFFFF;box-shadow:0 6px 16px rgba(0,158,227,.25)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:150px}
.back{background:none;border:0;color:var(--accent);font:600 .9rem var(--body);cursor:pointer;padding:0;margin-bottom:10px}
.note{font-size:.82rem;color:var(--muted)}
.okbox{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:var(--accent-ink);border-radius:22px 22px 22px 60px;padding:20px;margin-bottom:14px}
.okbox h2{color:var(--accent-ink);font-family:var(--script);font-weight:400;font-size:2.4rem;line-height:1.1}
.wa{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.88rem;white-space:pre-wrap}
.mpbox{box-shadow:var(--shadow);border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--surface);display:grid;gap:12px;text-align:center}
.mplogo{font-weight:800;color:var(--mp);letter-spacing:-.02em;font-size:1.2rem}
.timer{font-variant-numeric:tabular-nums;color:var(--warn);font-weight:700}
/* Panel */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{box-shadow:var(--shadow);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi small{color:var(--muted);font-size:.75rem;display:block}
.kpi b{font-family:var(--display);font-weight:700;color:var(--accent);font-size:1.55rem;font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;font-size:.75rem;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;font:600 .82rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tablewrap{box-shadow:var(--shadow);overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,150px) 1fr auto;gap:10px;align-items:center;font-size:.86rem}
.bar .track{height:10px;background:var(--accent-soft);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:5px}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);min-width:70px;text-align:right}
.chart{box-shadow:var(--shadow);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.chart svg{display:block;width:100%;height:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.two>div{min-width:0}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.methods{grid-template-columns:1fr}}
.method{box-shadow:var(--shadow);display:grid;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:16px;border-radius:16px;cursor:pointer;font:inherit}
.method:hover{border-color:var(--accent)}
.mtitle{font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--accent)}
.bankv{font-weight:600;text-align:right;display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--accent);font:700 .75rem var(--body);padding:5px 10px;border-radius:999px;cursor:pointer}
.mini.ok{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.mini.no{color:var(--warn)}
input[type=file]{padding:9px;background:var(--surface)}
.thumb{max-width:100%;max-height:220px;border-radius:12px;border:1px solid var(--line)}
.thumb.sm{width:56px;height:56px;object-fit:cover;max-height:none}
.verify{border:1px solid var(--warn);background:var(--warn-soft);border-radius:16px;padding:14px;margin-bottom:8px}
.vitem{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
@media (max-width:480px){.vitem{grid-template-columns:56px 1fr}.vbtns{grid-column:1/-1}}
.vinfo{display:grid;font-size:.85rem;min-width:0}
.vinfo span{color:var(--muted)}
.vbtns{display:flex;gap:6px}
.doc{width:56px;height:56px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--accent);font-size:.8rem}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;margin-left:4px}
.svcwrap{display:grid;gap:6px;min-width:0}
.svc .tick{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line);flex:0 0 18px;display:grid;place-items:center}
.svc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.svc[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.svc[aria-pressed="true"] .tick::after{content:"";width:8px;height:4px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.svcmain{flex:1;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:6px;padding:4px 2px 2px}
.opts small{width:100%;color:var(--muted);font-weight:600}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 .8rem var(--body);cursor:pointer}
.opt[aria-checked="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cartbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px 16px;box-shadow:0 10px 30px rgba(46,48,51,.16)}
.cartinfo{display:grid;font-size:.88rem;min-width:0}
.cartinfo span{color:var(--muted)}
.mailnote{margin:6px 0;opacity:.95}
.walink{color:var(--ok);font-weight:700;text-decoration:none;font-size:.82rem}
.walink:hover{text-decoration:underline}
.approved{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ok-soft);border:1px solid var(--ok);border-radius:16px;padding:14px;margin-bottom:10px}
.approved>div:first-child{display:grid;gap:2px;min-width:0}
.wa-btn{background:#25D366;color:#FFFFFF;box-shadow:none;text-decoration:none;font-size:.85rem;padding:10px 16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.loading{display:flex;gap:10px;align-items:center;color:var(--muted);padding:24px 0}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-weight:600;margin:10px 0}
a.btn{display:inline-flex;justify-content:center;align-items:center;text-decoration:none}
.pinbox{max-width:340px;margin:30px auto;display:grid;gap:12px;text-align:center}
.mini.act{color:var(--ink)}
.tiny{font-size:.75rem}
body{margin:0}
.firma{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.72rem;letter-spacing:.04em}
.firma img{width:28px;height:28px;border-radius:50%;object-fit:cover;opacity:.9}
.firma b{color:var(--ink);font-weight:700;letter-spacing:.12em}
.kpi b,.kpi i{display:block}
.kpi b{margin:2px 0}
.policy{white-space:pre-line;font-size:.82rem;line-height:1.55;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-height:220px;overflow:auto}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:.88rem;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:0 0 18px}
[hidden]{display:none!important}
img{max-width:100%}

.waitbox{display:grid;gap:10px;margin-top:22px;padding:16px;border:1px dashed var(--line);border-radius:16px;background:var(--surface)}
.waitbox>div{display:grid;gap:2px}
.method.off{cursor:default;opacity:.75}
select,textarea{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
textarea{resize:vertical;min-height:110px}
.cli{background:none;border:0;padding:0;font:inherit;color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.cli:hover{color:var(--accent);text-decoration-color:var(--accent)}
a.mini{text-decoration:none;display:inline-block}
span.doc{font-size:.72rem}

.svcs{align-items:start}
.summary .row.total:first-child{border-top:0;padding-top:0}
.summary .row>span:first-child{white-space:nowrap;margin-right:14px}
.day.closed{background:var(--bg);border-style:dashed;color:var(--muted)}
.day.closed small:last-child{color:var(--warn);font-weight:700;font-size:.6rem}
.day.closed[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.day.closed[aria-pressed="true"] small{color:var(--warn)}
.closedbox{display:grid;gap:4px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:14px;padding:14px 16px;color:var(--ink)}

rKsRU+xs4jWyVHPOsrKhBS2onbNGBNZWUQBUk0VJOaysogDhRFKEKNZWUUQMFHFZWVlEh/9k=) center/cover;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--accent),var(--shadow)}
header.top{align-items:center;justify-content:flex-start;gap:16px;flex-wrap:nowrap}
.brand{min-width:0}
@media (max-width:420px){.avatar{width:72px;height:72px;flex-basis:72px}.brand h1{font-size:1.85rem}.brand p{letter-spacing:.16em;font-size:.66rem}}
.steps{gap:8px}
.steps .st{flex:1;display:grid;gap:5px;min-width:0}
.steps .st span{height:4px;border-radius:2px;background:var(--line)}
.steps .st.on span{background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.steps .st small{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .st.cur small{color:var(--accent);font-weight:700}
.daysnav{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.daysnav .days{flex:1;margin:0;padding-bottom:0;scrollbar-width:none;scroll-behavior:smooth}
.daysnav .days::-webkit-scrollbar{display:none}
.dnav{flex:0 0 34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font:700 1.2rem/1 var(--body);cursor:pointer;box-shadow:var(--shadow)}
.dnav:hover{border-color:var(--accent)}
.slotgroup{margin-bottom:12px}
.sglabel{display:flex;align-items:center;gap:8px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.sglabel::after{content:"";flex:1;height:1px;background:var(--line)}
details.waitbox{display:block;padding:0;border-style:dashed}
details.waitbox summary{cursor:pointer;padding:14px 16px;font-size:.88rem;color:var(--muted);list-style:none}
details.waitbox summary::-webkit-details-marker{display:none}
details.waitbox summary b{color:var(--accent)}
details.waitbox[open] summary{border-bottom:1px dashed var(--line)}
details.waitbox .wbody{display:grid;gap:10px;padding:14px 16px}
.badge-top{display:inline-block;margin-bottom:3px;padding:2px 8px;border-radius:999px;background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#FFFFFF;font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.calbox{display:grid;gap:8px;margin:4px 0 14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.calbox b{font-size:.9rem}
.calbtns{display:flex;gap:8px;flex-wrap:wrap}
.calbtns a{flex:1;min-width:140px;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font:600 .85rem var(--body);color:var(--ink);background:var(--bg)}
.calbtns a:hover{border-color:var(--accent);color:var(--accent)}
.info{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;margin-top:34px;font-size:.85rem}
.info a{display:inline-flex;align-items:center;gap:7px;color:var(--ink);text-decoration:none;font-weight:600}
.info a:hover{color:var(--accent)}
.info svg{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.firma{margin-top:22px}
.hoy{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.hoyhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.hoyday{flex:1 1 100%;display:grid}
.hoyday small{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.hoyday b{font-family:var(--display);font-size:1.35rem}
.hoykpi{flex:1;display:grid;text-align:center;background:var(--bg);border-radius:12px;padding:6px 12px}
.hoykpi b{font-family:var(--display);color:var(--accent);font-size:1.2rem;font-variant-numeric:tabular-nums}
.hoykpi span{font-size:.7rem;color:var(--muted)}
.hoyrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.hoyrow .hh{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.hoyrow .hi{display:grid;min-width:0;font-size:.88rem}
.hoyrow .hi span{color:var(--muted);font-size:.8rem}
.cobra{font-size:.75rem;font-weight:700;color:var(--ink);background:var(--accent-soft);padding:3px 9px;border-radius:999px;white-space:nowrap}
.hoyclosed{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.85rem;font-weight:600;margin:4px 0 6px}
.hoyman{margin:8px 0 0}
.bloq{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.bloq .bi{display:grid;gap:2px;min-width:0;font-size:.88rem}
details.fold{margin:14px 0;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding:14px 44px 14px 16px;position:relative;font-size:.86rem;color:var(--muted)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold .fold-t{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);font-weight:700}
details.fold .fold-r b{color:var(--accent)}
details.fold .chev{position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:translateY(-70%) rotate(45deg);transition:transform .2s}

.tsc{--tp:#FCE4D4;--tb:#8A6748;--tg:#C99A2E;--tt:#B8916B;--tr:#D9BCA3;position:relative;width:100%;aspect-ratio:1005/591;background:var(--tp);border-radius:4.5% / 7.6%;overflow:hidden;box-shadow:0 14px 34px rgba(138,103,72,.28),inset 0 0 0 1px rgba(138,103,72,.08);container-type:inline-size;color:var(--tb);transform-origin:50% 60%}
.tsc .t1{position:absolute;top:5%;left:0;right:0;text-align:center;font:400 8.6cqw/1 'Bebas Neue',Impact,sans-serif;letter-spacing:.02em;color:var(--tb);text-shadow:0 0 1px rgba(138,103,72,.4)}
.tsc .t2{position:absolute;top:15%;left:0;right:0;text-align:center;font:400 14cqw/1 'Yellowtail',cursive;color:var(--tg);transform:rotate(-4deg);clip-path:inset(-10% 100% -45% 0)}

.tsc .tc{position:relative;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 0 .55cqw var(--tr);display:grid;place-items:center;font:300 4cqw/1 'Montserrat',sans-serif;color:var(--tt)}
.tsc .tc .pz{position:relative;z-index:1;transition:color .3s}
.tsc .tc .tsc-st{position:absolute;inset:7%;z-index:2;opacity:0}
.tsc .tc.on .tsc-st{opacity:.9}
.tsc .tc.now .tsc-st{animation:tscSello .55s cubic-bezier(.2,1.6,.4,1) 1.25s both}
.tsc .tc.gana{box-shadow:0 0 0 .55cqw var(--tg)}
.tsc .tc.gana .pz{color:var(--tg);font-weight:700}
.tsc .tc.gana.now{animation:tscGlow 1.6s ease-in-out 1.9s infinite}
.tsc .tc .sp{position:absolute;left:50%;top:50%;width:1.6cqw;height:1.6cqw;margin:-.8cqw;opacity:0;color:var(--tg);font-size:2.6cqw;line-height:1;z-index:3}
.tsc .tc.gana.now .sp{animation:tscChispa .9s ease-out 1.55s both}
.tsc .t3{position:absolute;top:69.5%;left:0;right:0;text-align:center;font:400 3.2cqw/1 'Cutive Mono',monospace;color:var(--tb);letter-spacing:.01em}
.tsc .tpill{position:absolute;top:77.5%;left:27%;right:27%;height:10.5%;background:#fff;border-radius:99px;display:grid;place-items:center;font:400 3.15cqw/1 'Cutive Mono',monospace;color:var(--tb);letter-spacing:.03em;text-transform:uppercase}

.tsc .tsc-gift{position:absolute;right:1.5%;bottom:3%;width:17%;color:var(--tt)}
.tsc .tsc-gift .tapa{transform-origin:30% 100%;animation:tscTapa 3.2s ease-in-out 2s infinite}
.tsc .tsc-gift .est{animation:tscTwinkle 2.2s ease-in-out infinite}
.tsc .tsc-gift .est:nth-of-type(2){animation-delay:.7s}.tsc .tsc-gift .est:nth-of-type(3){animation-delay:1.4s}
.tsc.anim{animation:tscIn .7s cubic-bezier(.2,1.3,.4,1) both,tscThud .35s ease-out 1.48s}
.tsc.anim .t2{animation:tscWipe 1s ease-out .35s forwards}
.tsc:not(.anim) .t2{clip-path:none}
@keyframes tscIn{0%{transform:scale(.55) rotate(-7deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes tscWipe{to{clip-path:inset(-10% -5% -45% 0)}}
@keyframes tscSello{0%{opacity:0;transform:scale(2.6) rotate(-35deg)}100%{opacity:.9;transform:scale(1) rotate(var(--r,-10deg))}}
@keyframes tscThud{0%{transform:translateY(0)}35%{transform:translateY(1.2%) scale(.992)}100%{transform:none}}
@keyframes tscGlow{0%,100%{box-shadow:0 0 0 .55cqw var(--tg),0 0 0 0 rgba(201,154,46,.55)}50%{box-shadow:0 0 0 .55cqw var(--tg),0 0 0 2.2cqw rgba(201,154,46,0)}}
@keyframes tscChispa{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.3)}}
@keyframes tscTapa{0%,70%,100%{transform:none}78%{transform:translate(-2%,-14%) rotate(-12deg)}88%{transform:translate(0,-4%) rotate(4deg)}}
@keyframes tscTwinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}

    ${D.regalar ? `<button type="button" class="amigabox gift" id="b-regalar"><span class="ai">\ud83c\udf81</span><span><b>\u00bfQuer\u00e9s regalar un servicio?</b><small>Compr\u00e1 una tarjeta regalo y mand\u00e1sela por WhatsApp.</small></span><span class="mas">\u203a</span></button>` : ''}
    <div class="cartbar" ${n||m?'':'hidden'}>
      ${st.amiga ? `<div class="cartinfo"><b>Vos: ${n||'\u2014'} \u00b7 Tu amiga: ${m||'\u2014'}</b><span>${n&&m?durTxt(c.d+cb.d)+' en total \u00b7 se\u00f1as '+fmt$(c.senaPesos+cb.senaPesos):m?'Eleg\u00ed tambi\u00e9n lo tuyo':'Eleg\u00ed lo de tu amiga'}</span></div>`

  });

  app.querySelectorAll('[data-para]').forEach(b=>b.onclick=()=>{ st.para=b.dataset.para; const y=scrollY; paso1(); scrollTo(0,y); });
  const ba=document.getElementById('b-amiga'); if(ba) ba.onclick=()=>{ st.amiga={sel:{}, nombre:'', phone:'', email:''}; st.para='amiga'; paso1(); const t=app.querySelector('.paratabs'); if(t) t.scrollIntoView({block:'start'}); };
  const bax=document.getElementById('b-amigax'); if(bax) bax.onclick=()=>{ st.amiga=null; st.para='yo'; const y=scrollY; paso1(); scrollTo(0,y); };

    google.script.run.withSuccessHandler(a=>{a.diasTodos=a.dias.filter(d=>!d.cerrado).map(d=>d.fecha); st.avail=a; st.day=null; st.step=2; render();})
      .withFailureHandler(e=>{st.step=1; render(); error(e);}).getAvailability(cur().items, conAmiga()?curB().items:null); };

      <button class="btn ghost" id="b-wait" type="button">Anotarme en la lista de espera</button></div></details>`:''}`;
  document.getElementById('b-back').onclick=()=>{st.step=1;render();};

      : `<label for="in-name">Nombre y apellido<input id="in-name" required autocomplete="name" value="${esc(st.name)}" placeholder="Ej.: Ana P\u00e9rez"></label>
      <label for="in-email">Correo electr\u00f3nico<input id="in-email" type="email" required autocomplete="email" value="${esc(st.email)}" placeholder="ana@gmail.com"></label>

      <div class="cumple" id="bdbox" ${st.tieneCumple===true?'hidden':''}><span class="lbl">Fecha de cumplea\u00f1os <span class="note">(d\u00eda y mes \u00b7 se pide una sola vez)</span></span>
        <div class="bday"><select id="in-bd" aria-label="D\u00eda de cumplea\u00f1os" ${st.tieneCumple===true?'':'required'}><option value="">D\u00eda</option>${Array.from({length:31},(_,i)=>`<option ${st.cumple&&+st.cumple.slice(3)===i+1?'selected':''}>${i+1}</option>`).join('')}</select><select id="in-bm" aria-label="Mes de cumplea\u00f1os" ${st.tieneCumple===true?'':'required'}><option value="">Mes</option>${MESL.map((m,i)=>`<option value="${i+1}" ${st.cumple&&+st.cumple.slice(0,2)===i+1?'selected':''}>${m}</option>`).join('')}</select></div></div>

        <div class="cumple"><span class="lbl">Su cumplea\u00f1os <span class="note">(d\u00eda y mes)</span></span>
          <div class="bday"><select id="in-abd" required aria-label="D\u00eda del cumplea\u00f1os de tu amiga"><option value="">D\u00eda</option>${Array.from({length:31},(_,i)=>`<option ${st.amiga.cumple&&+st.amiga.cumple.slice(3)===i+1?'selected':''}>${i+1}</option>`).join('')}</select><select id="in-abm" required aria-label="Mes del cumplea\u00f1os de tu amiga"><option value="">Mes</option>${MESL.map((m,i)=>`<option value="${i+1}" ${st.amiga.cumple&&+st.amiga.cumple.slice(0,2)===i+1?'selected':''}>${m}</option>`).join('')}</select></div></div></fieldset>`:''}

      <label class="check" for="in-ok"><input id="in-ok" type="checkbox" required ${st.acepto?'checked':''}> Le\u00ed y acepto la pol\u00edtica de reservas y cancelaciones</label>
      <button class="btn" type="submit">${conAmiga()?'Continuar al pago de las se\u00f1as':qv()&&st.q.cod&&qv().sena===0?'Confirmar mi turno':'Continuar al pago de la se\u00f1a'}</button>

    const bd=document.getElementById('in-bd'), bm=document.getElementById('in-bm'); st.cumple = (!document.getElementById('bdbox').hidden && bd.value && bm.value) ? String(bm.value).padStart(2,'0')+'-'+String(bd.value).padStart(2,'0') : '';

function capturarDatos(){
  const n=document.getElementById('in-name'); if(!n) return;
  st.name=n.value.trim(); st.email=document.getElementById('in-email').value.trim(); st.phone=document.getElementById('in-phone').value; st.acepto=document.getElementById('in-ok').checked;
  if(conAmiga() && document.getElementById('in-an')){ st.amiga.nombre=document.getElementById('in-an').value.trim(); st.amiga.phone=document.getElementById('in-ap').value; st.amiga.email=document.getElementById('in-ae').value.trim(); const abd=document.getElementById('in-abd'), abm=document.getElementById('in-abm'); st.amiga.cumple=(abd.value&&abm.value)?String(abm.value).padStart(2,'0')+'-'+String(abd.value).padStart(2,'0'):''; }
  const bd=document.getElementById('in-bd'), bm=document.getElementById('in-bm'); if(bd&&bm&&bd.value&&bm.value) st.cumple=String(bm.value).padStart(2,'0')+'-'+String(bd.value).padStart(2,'0');
}
function aplicarCodigo(){
  const gb=document.getElementById('gbox'); if(gb) gb.innerHTML='<div class="loading" style="padding:14px"><span class="spin"></span>Revisando el c\u00f3digo\u2026</div>';
  google.script.run.withSuccessHandler(r=>{
    capturarDatos(); if(!r.ok){ st.q=null; st.codeErr=r.msg; st.codeOpen=true; paso3(); const g=document.getElementById('gform'); if(g){ g.classList.add('shake'); } return; }
    capturarDatos(); if(r.codDescartado){ st.q=null; st.code=''; st.codeErr='Ten\u00e9s un beneficio mejor que este cup\u00f3n esper\u00e1ndote \ud83c\udf81 Lo vas a ver al pagar.'; st.codeOpen=true; paso3(); return; }
    if(r.sorpresa && !st.sxVisto){ r.sorpresaOculta=true; }
    capturarDatos(); st.q=r; st.codeErr=''; st.pago='sena'; st.code=r.cod?r.cod.codigo:st.code; paso3();
  }).withFailureHandler(e=>{ capturarDatos(); st.codeErr=String(e&&e.message||e); paso3(); }).cotizarReserva(cur().items, st.code, st.phone, st.email, st.day, conAmiga()?curB().items:null, conAmiga()?st.amiga.phone:'');
}

function reservarDirecto(){
  cargando('Confirmando tu turno\u2026');
  google.script.run.withSuccessHandler(r=>{
    if(!r.ok){ volverAHorarios(r.msg); return; }
    st.res=r; st.step=5; render();
  }).withFailureHandler(e=>{st.step=3; render(); error(e);}).crearReserva(datosReserva());
}

function paso4(){
  const c = cur();
  const extra = c.usd ? ` <small class="note">(se cobra en pesos: ${fmt$(c.senaPesos)})</small>` : '';
  const elegir = !conAmiga() && !!(st.q && st.q.total && st.q.total.sena !== st.q.sena.sena);

  if(conAmiga() && !elegirB) st.pago='sena';
  const bb = curB();
  const fd = fdate(st.day);
  const op = (modo, titulo, sub, monto, tag) => `<button class="payopt${st.pago===modo?' on':''}" type="button" data-pago="${modo}" aria-pressed="${st.pago===modo}"><span class="rd"></span><span class="pt"><b>${titulo}${tag?` <span class="paytag">${tag}</span>`:''}</b><small>${sub}</small></span><span class="amt">${fmt$(monto)}</span></button>`;
  const cab = elegir
    ? `<h2>\u00bfCu\u00e1nto quer\u00e9s pagar ahora?</h2><p class="sub">${esc(c.n)} \u00b7 ${DIAS[fd.getDay()]} ${fd.getDate()} de ${MESL[fd.getMonth()]}, ${hhmm(st.time)} h</p>

      <h3 style="margin-top:4px">\u00bfC\u00f3mo pag\u00e1s?</h3>`
    : elegirB ? `<h2>\u00bfCu\u00e1nto quieren pagar ahora?</h2><p class="sub">Vos: ${esc(c.n)} \u00b7 tu amiga: ${esc(bb.n)}</p>
      <div class="paysel">${op('sena', 'Se\u00f1a de las dos', 'El resto lo pagan el d\u00eda del turno.', st.q.sena.sena + senaBn(), '')}
      ${op('total', 'Todo el servicio de las dos', 'El d\u00eda del turno no pagan nada.', st.q.total.sena + precioBn(), 'Listo y olvidate')}</div>
      <p class="note" style="margin:-6px 0 14px">${st.pago==='total'?`Tuyo ${fmt$(st.q.total.sena)} + de tu amiga ${fmt$(precioBn())}, en un solo pago. Si cancelan con ${D.minHoras} h o m\u00e1s se devuelve todo; con menos, se retiene el ${D.retiene} % de cada servicio.`:`Tu se\u00f1a ${fmt$(st.q.sena.sena)} + la de tu amiga ${fmt$(senaBn())}, en un solo pago.`}</p>
      <h3 style="margin-top:4px">\u00bfC\u00f3mo pag\u00e1s?</h3>`
    : conAmiga() ? `<h2>\u00bfC\u00f3mo pag\u00e1s las se\u00f1as?</h2><p class="sub">Tu se\u00f1a ${fmt$(senaYo())} + la de tu amiga ${fmt$(senaBn())} = <b>${fmt$(senaTot())}</b> en un solo pago.</p>`
    : usaQ() ? `<h2>\u00bfC\u00f3mo pag\u00e1s?</h2><p class="sub">${st.pago==='total'?'Total':'Se\u00f1a'} de <b>${fmt$(qv().sena)}</b>.</p>`
    : `<h2>\u00bfC\u00f3mo pag\u00e1s la se\u00f1a?</h2><p class="sub">Se\u00f1a de <b>${c.senaTxt}</b>${extra}.</p>`;
  app.innerHTML = `<button class="back" id="b-back">\u2190 Cambiar datos</button>`+stepsBar(4)+ribbonSx()+tarjetasMini()+cab+`
    <div class="methods">
      ${D.mp?`<button class="method mpm" id="m-mp"><span class="mtitle">\ud83d\udcb3 Tarjeta o Mercado Pago${cuotasTag()}</span><span class="note">Cr\u00e9dito${D.cuotas>1?' en hasta <b>'+D.cuotas+' cuotas</b>':''}, d\u00e9bito o saldo de Mercado Pago. <b>Confirmaci\u00f3n inmediata.</b></span></button>`:''}
      ${D.transferencia?`<button class="method" id="m-tr"><span class="mtitle">Transferencia bancaria</span><span class="note">Transfer\u00eds y sub\u00eds el comprobante. <b>Paula lo verifica</b> y te confirma.</span></button>`:''}
    </div>`;
  document.getElementById('b-back').onclick=()=>{st.step=3;render();};
  app.querySelectorAll('[data-pago]').forEach(b=>b.onclick=()=>{ st.pago=b.dataset.pago; paso4(); });
  const mp=document.getElementById('m-mp'), tr=document.getElementById('m-tr');
  if(mp) mp.onclick=()=>{st.medio='mp'; reservarMP();};
  if(tr) tr.onclick=()=>{st.medio='transferencia'; st.step=42; render();};
}

const cuotasTag = () => D.cuotas>1 ? ` <span class="cuotag">hasta ${D.cuotas} cuotas</span>` : '';
function datosReserva(){ return {ses:SES.get(), items:cur().items, fecha:st.day, inicio:st.time, nombre:st.name, telefono:st.phone, email:st.email, medio:st.medio, codigo:st.q&&st.q.cod?st.q.cod.codigo:'', pago:st.pago, cumple:st.cumple, reconocida:esReco(), ref:st.ref,
  amiga: conAmiga() ? {items:curB().items, nombre:st.amiga.nombre, telefono:st.amiga.phone, email:st.amiga.email, cumple:st.amiga.cumple} : null}; }

function reservarMP(){
  cargando('Reservando tu horario\u2026');
  google.script.run.withSuccessHandler(r=>{
    if(!r.ok){ st.step=2; st.avail=null; volverAHorarios(r.msg); return; }
    st.res=r; st.step=41; render();
  }).withFailureHandler(e=>{st.step=4; render(); error(e);}).crearReserva(datosReserva());
}

function volverAHorarios(msg){
  cargando('Actualizando horarios\u2026');
  const ib = conAmiga()?curB().items:null;
  google.script.run.withSuccessHandler(a=>{a.diasTodos=a.dias.filter(d=>!d.cerrado).map(d=>d.fecha); st.avail=a; st.step=2; render(); error({message:msg});})
    .withFailureHandler(e=>{st.step=1; render(); error(e);}).getAvailability(cur().items, ib);
}

    <div style="font-family:var(--display);font-size:2.2rem;font-weight:700">${fmt$(st.res.sena)}</div>

    <a class="btn mp" href="${esc(st.res.payUrl)}" target="_top">Ir a pagar</a>

}

function pasoTransferencia(){
  const c = cur();
  const filas = (banco, monto, ref) => `${Object.entries(banco).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><span class="bankv">${esc(v)}${k==='N\u00famero de cuenta'?` <button class="mini b-copy" type="button" data-v="${esc(v)}">Copiar</button>`:''}</span></div>`).join('')}
      <div class="row"><span>Referencia</span><span class="bankv">${esc(st.name)}</span></div>
      <div class="row total"><span>Monto a transferir</span><span>${monto}</span></div>`;
  let cuentas;
  if (conAmiga()) {
    cuentas = `<div class="summary">${filas(D.banco, fmt$(senaTot()))}</div><p class="note" style="margin-top:-6px">Incluye ${st.pago==='total'?'tu servicio completo ('+fmt$(senaYo())+') y el de tu amiga ('+fmt$(pagoB())+')':'tu se\u00f1a ('+fmt$(senaYo())+') y la de tu amiga ('+fmt$(pagoB())+')'}.</p>`;
  } else if (usaQ()) {
    cuentas = `<div class="summary">${filas(D.banco, fmt$(qv().sena))}</div>`;
  } else if (c.usd && D.bancoUSD) {
    cuentas = `<h3>Opci\u00f3n 1 \u00b7 Transferencia en d\u00f3lares</h3><div class="summary">${filas(D.bancoUSD, c.senaTxt)}</div>
      <h3>Opci\u00f3n 2 \u00b7 Transferencia en pesos</h3><div class="summary">${filas(D.banco, fmt$(c.senaPesos))}</div>
      <p class="note">Eleg\u00ed una sola de las dos opciones.</p>`;
  } else {
    const monto = c.usd ? `${c.senaTxt} <span class="note">o ${fmt$(c.senaPesos)}</span>` : c.senaTxt;
    cuentas = `<div class="summary">${filas(D.banco, monto)}</div>`;
  }
  app.innerHTML = `<button class="back" id="b-back">\u2190 Elegir otro medio</button>`+stepsBar(4)+
    `<h2>Transferencia bancaria</h2><p class="sub">Transfer\u00ed ${conAmiga()?(st.pago==='total'?'el total de los dos servicios':'las dos se\u00f1as'):st.pago==='total'?'el total':'la se\u00f1a'} y sub\u00ed el comprobante para reservar ${conAmiga()?'los dos horarios':'el horario'}.</p>
    ${cuentas}
    <form id="ft">
      <label for="in-file">Comprobante de transferencia (foto o PDF, hasta 5 MB)
        <input id="in-file" type="file" accept="image/${"*"},application/pdf" required></label>
      <div id="prev"></div>
      <p class="note">Tu horario queda <b>reservado ${D.horasTr} horas</b> mientras Paula verifica el pago. Si no se puede verificar, el horario se libera.</p>
      <button class="btn" type="submit" id="b-send">Enviar comprobante y reservar</button>
    </form>`;
  document.getElementById('b-back').onclick=()=>{st.step=4;render();};
  app.querySelectorAll('.b-copy').forEach(b=>b.onclick=async(ev)=>{const v=b.dataset.v;try{await navigator.clipboard.writeText(v);b.textContent='Copiado';}catch(e){b.textContent=v;}});
  const fi=document.getElementById('in-file'); st.file=null;
  fi.onchange=()=>{
    const f=fi.files[0]; if(!f) return;
    if(f.size>5*1024*1024){ fi.value=''; error({message:'El archivo pesa m\u00e1s de 5 MB. Prob\u00e1 con una captura de pantalla.'}); return; }
    const r=new FileReader();
    r.onload=()=>{ const b64=String(r.result).split(',')[1]; st.file={nombre:f.name, tipo:f.type, base64:b64};
      document.getElementById('prev').innerHTML = f.type.startsWith('image/') ? `<img class="thumb" src="${r.result}" alt="Vista previa del comprobante">` : `<p class="note">Archivo: ${esc(f.name)}</p>`; };
    r.readAsDataURL(f);
  };
  document.getElementById('ft').onsubmit=e=>{e.preventDefault();
    if(!st.file){ error({message:'Esper\u00e1 un segundo a que cargue el comprobante y volv\u00e9 a tocar el bot\u00f3n.'}); return; }
    const d = datosReserva(); d.archivo = st.file;
    cargando('Enviando comprobante y reservando\u2026');
    google.script.run.withSuccessHandler(r=>{
      if(!r.ok){ volverAHorarios(r.msg); return; }
      st.res=r; st.step=5; render();
    }).withFailureHandler(e=>{st.step=42; render(); error(e);}).crearReserva(d);
  };
}

function rgTotal(){ return Object.keys(rgSel().sel).reduce((a,id)=>{ const s=S(id); return a+(s?Math.round(pesos(s,s.precio)):0); },0); }
function rgNombres(){ return Object.keys(rgSel().sel).map(id=>S(id).nombre).join(' + '); }

function regalar1(){
  const R=rgSel(); const groups=[...new Set(D.servicios.map(s=>s.cat))]; const n=Object.keys(R.sel).length;
  app.innerHTML = `<button class="back" id="b-back">\u2190 Volver a reservar</button>`+rgPasos(1)+`<div class="rghead"><span>\ud83c\udf81</span><div><h2>Regal\u00e1 un servicio</h2><p class="sub">Eleg\u00ed qu\u00e9 le quer\u00e9s regalar. Te mandamos una tarjeta regalo hermosa para que se la mandes por WhatsApp.</p></div></div>
    <div class="svcs">${groups.map(g=>`<div class="grouplabel">${esc(g)}</div>`+D.servicios.filter(s=>s.cat===g).map(s=>`<div class="svcwrap"><button class="svc" data-id="${esc(s.id)}" aria-pressed="${s.id in R.sel}"><span class="tick" aria-hidden="true"></span><span class="svcmain"><b>${esc(s.nombre)}</b></span><span class="price">${fmt$(Math.round(pesos(s,s.precio)))}</span></button></div>`).join('')).join('')}</div>
    <div class="cartbar" ${n?'':'hidden'}><div class="cartinfo"><b>Tarjeta regalo \u00b7 ${fmt$(rgTotal())}</b><span>${esc(rgNombres())}</span></div><button class="btn" id="b-rg1">Seguir</button></div>
    <p class="note" style="margin-top:14px">La tarjeta vale el precio del servicio y se usa al reservar. Vence a los ${D.vencRegalo||6} meses.</p>`;
  document.getElementById('b-back').onclick=()=>{ st.step=ESP?'esp':1; if(ESP) espacio(); else render(); };
  app.querySelectorAll('.svc').forEach(b=>b.onclick=()=>{ const id=b.dataset.id; if(id in R.sel) delete R.sel[id]; else R.sel[id]=0; const y=scrollY; regalar1(); scrollTo(0,y); });
  const b=document.getElementById('b-rg1'); if(b) b.onclick=()=>{ st.step='rg2'; render(); };
  window.scrollTo(0,0);
}
function regalar2(){
  const R=rgSel();
  app.innerHTML = `<button class="back" id="b-back">\u2190 Cambiar el regalo</button>`+rgPasos(2)+`<h2>Dedicatoria</h2><p class="sub">${esc(rgNombres())} \u00b7 <b>${fmt$(rgTotal())}</b></p>
    <form id="frg">
      <label for="rg-para">\u00bfPara qui\u00e9n es?<input id="rg-para" required maxlength="60" value="${esc(R.para)}" placeholder="Ej.: Sofi"></label>
      <label for="rg-de">\u00bfDe parte de qui\u00e9n?<input id="rg-de" maxlength="60" value="${esc(R.de)}" placeholder="Ej.: Tu hermana Ana"></label>
      <label for="rg-msg">Mensaje <span class="note">(opcional)</span><textarea id="rg-msg" maxlength="240" rows="3" placeholder="\u00a1Feliz cumple! Te merec\u00e9s un mimo \ud83d\udc9b">${esc(R.mensaje)}</textarea></label>
      <h3>Tus datos</h3><p class="note" style="margin-top:-6px">A tu correo te mandamos la tarjeta cuando Paula verifique el pago.</p>
      <label for="rg-n">Tu nombre y apellido<input id="rg-n" required autocomplete="name" value="${esc(R.name)}"></label>
      <label for="rg-e">Tu correo electr\u00f3nico<input id="rg-e" type="email" required autocomplete="email" value="${esc(R.email)}" placeholder="ana@gmail.com"></label>
      <label for="rg-p">Tu celular (WhatsApp)<input id="rg-p" required inputmode="tel" pattern="09[0-9]{7}" title="9 n\u00fameros, empezando con 09" value="${esc(R.phone)}" placeholder="099123456"></label>
      <button class="btn" type="submit">Continuar al pago</button></form>`;
  const g=()=>{ R.para=v('rg-para'); R.de=v('rg-de'); R.mensaje=document.getElementById('rg-msg').value.trim(); R.name=v('rg-n'); R.email=v('rg-e'); R.phone=document.getElementById('rg-p').value.replace(/\D/g,'').slice(0,9); };
  const v=id=>document.getElementById(id).value.trim();
  document.getElementById('rg-p').addEventListener('input',e=>{ e.target.value=e.target.value.replace(/\D/g,'').slice(0,9); });
  document.getElementById('b-back').onclick=()=>{ g(); st.step='rg1'; render(); };
  document.getElementById('frg').onsubmit=e=>{ e.preventDefault(); g(); if(!R.de) R.de=R.name.split(' ')[0]; st.step='rg3'; render(); };
  window.scrollTo(0,0);
}
function regalar3(){
  const R=rgSel();
  if(D.mp && !R.medio){
    if(!D.transferencia){ R.medio='mp'; }
    else {
      app.innerHTML = `<button class="back" id="b-back">\u2190 Cambiar la dedicatoria</button>`+rgPasos(3)+`<h2>\u00bfC\u00f3mo pag\u00e1s?</h2><p class="sub">Tarjeta regalo de <b>${fmt$(rgTotal())}</b> para <b>${esc(R.para)}</b>.</p>
        <div class="methods"><button class="method mpm" id="m-mp" type="button"><span class="mtitle">\ud83d\udcb3 Tarjeta o Mercado Pago${cuotasTag()}</span><span class="note">Cr\u00e9dito${D.cuotas>1?' en hasta <b>'+D.cuotas+' cuotas</b>':''}, d\u00e9bito o saldo. <b>La tarjeta te llega al instante.</b></span></button>
        <button class="method" id="m-tr" type="button"><span class="mtitle">Transferencia bancaria</span><span class="note">Transfer\u00eds y sub\u00eds el comprobante. Paula lo verifica y te mandamos la tarjeta.</span></button></div>`;
      document.getElementById('b-back').onclick=()=>{ st.step='rg2'; render(); };
      document.getElementById('m-mp').onclick=()=>{ R.medio='mp'; regalar3(); };
      document.getElementById('m-tr').onclick=()=>{ R.medio='tr'; regalar3(); };
      window.scrollTo(0,0); return;
    }
  }
  if(R.medio==='mp'){
    cargando('Preparando el pago\u2026');
    google.script.run.withSuccessHandler(r=>{
      if(!r.ok){ R.medio=null; regalar3(); error({message:r.msg}); return; }
      app.innerHTML = rgPasos(3)+`<div class="mpbox"><div class="mplogo">mercado pago</div><div>Tarjeta regalo \u00b7 <b>${esc(r.servicios)}</b> para <b>${esc(r.para)}</b></div>
        <div style="font-family:var(--display);font-size:2.2rem;font-weight:700">${fmt$(r.monto)}</div>
        ${D.cuotas>1?`<div class="cuotabox">\ud83d\udcb3 Con tarjeta de cr\u00e9dito pod\u00e9s pagar en <b>hasta ${D.cuotas} cuotas</b>.</div>`:''}
        <a class="btn mp" href="${esc(r.payUrl)}" target="_top">Ir a pagar</a>
        <div class="note">Cuando termines, Mercado Pago te trae de vuelta ac\u00e1 y te mostramos la tarjeta regalo. Tambi\u00e9n te llega a <b>${esc(r.email)}</b>.</div>
        <button class="espl" type="button" id="b-otro">\u2190 Elegir otro medio de pago</button></div>`;
      const bo=document.getElementById('b-otro'); if(bo) bo.onclick=()=>{ R.medio=null; regalar3(); };
      window.scrollTo(0,0);
    }).withFailureHandler(e=>{ R.medio=null; regalar3(); error(e); }).comprarRegalo({items:Object.keys(R.sel).map(id=>({id})), para:R.para, de:R.de, mensaje:R.mensaje, nombre:R.name, telefono:R.phone, email:R.email, medio:'mp'});
    return;
  }
  const filas = `${Object.entries(D.banco).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><span class="bankv">${esc(v)}${k==='N\u00famero de cuenta'?` <button class="mini b-copy" type="button" data-v="${esc(v)}">Copiar</button>`:''}</span></div>`).join('')}
    <div class="row"><span>Referencia</span><span class="bankv">Regalo ${esc(R.name)}</span></div><div class="row total"><span>Monto a transferir</span><span>${fmt$(rgTotal())}</span></div>`;
  app.innerHTML = `<button class="back" id="b-back">\u2190 Cambiar la dedicatoria</button>`+rgPasos(3)+`<h2>Transferencia bancaria</h2><p class="sub">Transfer\u00ed el valor de la tarjeta y sub\u00ed el comprobante.</p>
    <div class="summary">${filas}</div>
    <form id="ft"><label for="in-file">Comprobante de transferencia (foto o PDF, hasta 5 MB)<input id="in-file" type="file" accept="image/${"*"},application/pdf" required></label><div id="prev"></div>
      <p class="note">Paula verifica la transferencia y te mandamos la tarjeta a <b>${esc(R.email)}</b>.</p>
      <button class="btn" type="submit">Enviar comprobante</button></form>`;
  document.getElementById('b-back').onclick=()=>{ if(D.mp){ R.medio=null; regalar3(); } else { st.step='rg2'; render(); } };
  app.querySelectorAll('.b-copy').forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.dataset.v); b.textContent='Copiado'; }catch(e){ b.textContent=b.dataset.v; } });
  const fi=document.getElementById('in-file'); R.file=null;
  fi.onchange=()=>{ const f=fi.files[0]; if(!f) return;
    if(f.size>5*1024*1024){ fi.value=''; error({message:'El archivo pesa m\u00e1s de 5 MB. Prob\u00e1 con una captura de pantalla.'}); return; }
    const r=new FileReader(); r.onload=()=>{ R.file={nombre:f.name, tipo:f.type, base64:String(r.result).split(',')[1]};
      document.getElementById('prev').innerHTML = f.type.startsWith('image/') ? `<img class="thumb" src="${r.result}" alt="Vista previa del comprobante">` : `<p class="note">Archivo: ${esc(f.name)}</p>`; }; r.readAsDataURL(f); };
  document.getElementById('ft').onsubmit=e=>{ e.preventDefault();
    if(!R.file){ error({message:'Esper\u00e1 un segundo a que cargue el comprobante y volv\u00e9 a tocar el bot\u00f3n.'}); return; }
    cargando('Enviando tu pedido\u2026');
    google.script.run.withSuccessHandler(r=>{
      if(!r.ok){ regalar3(); error({message:r.msg}); return; }
      const wa='https:\/\/wa.me/598'+String(D.whatsapp).replace(/\D/g,'').replace(/^0/,'')+'?text='+encodeURIComponent('Hola Paula! Soy '+R.name+'. Compr\u00e9 una tarjeta regalo ('+r.servicios+') para '+r.para+' y envi\u00e9 el comprobante.');
      app.innerHTML=`<div class="okbox gift"><div class="big">\ud83c\udf81</div><h2>\u00a1Pedido enviado!</h2><div><b>${esc(r.servicios)}</b> para <b>${esc(r.para)}</b> \u00b7 ${fmt$(r.monto)}</div><div>Paula verifica la transferencia y te mandamos la tarjeta regalo a <b>${esc(r.email)}</b>. Desde ah\u00ed la guard\u00e1s como imagen o se la mand\u00e1s por WhatsApp.</div></div>
        <div class="btnrow"><a class="btn wa-btn" href="${wa}" target="_blank" rel="noopener">Avisar a Paula por WhatsApp</a><a class="btn ghost" href="${esc(D.url)}" target="_top">Ir a reservar</a></div>`;
      st.rg=null; window.scrollTo(0,0);
    }).withFailureHandler(e=>{ regalar3(); error(e); }).comprarRegalo({items:Object.keys(R.sel).map(id=>({id})), para:R.para, de:R.de, mensaje:R.mensaje, nombre:R.name, telefono:R.phone, email:R.email, archivo:R.file});
  };
  window.scrollTo(0,0);
}
function gestion(){
  const g = st.g; const fd = fdate(g.fecha);
  const cuando = `${DIAS[fd.getDay()]} ${fd.getDate()} de ${MESL[fd.getMonth()]}, de ${g.inicio} a ${g.fin} h`;
  const waP = m => 'https:\/\/wa.me/598'+String(D.whatsapp).replace(/\D/g,'').replace(/^0/,'')+'?text='+encodeURIComponent(m);
  const resumen = `<div class="summary"><div class="row"><span>Servicio</span><span style="text-align:right">${esc(g.servicios)}</span></div>
    <div class="row"><span>D\u00eda</span><span>${cuando}</span></div>
    ${g.sena?`<div class="row"><span>${g.pago==='total'?'Pagado':'Se\u00f1a'}</span><span>${fmt$(g.sena)}</span></div>`:''}${g.regalo?`<div class="row"><span>Tarjeta regalo</span><span>${fmt$(g.regalo)}</span></div>`:''}</div>`;
  const devTxt = g.dev ? [g.dev.cash?'se te devuelven <b>'+fmt$(g.dev.cash)+'</b>':'', g.dev.regalo?'<b>'+fmt$(g.dev.regalo)+'</b> vuelven a tu tarjeta regalo':''].filter(Boolean).join(' y ') : '';
  if(!g.activo){
    app.innerHTML=`<h2>Tu turno</h2>${resumen}<p class="note">Este turno ya no est\u00e1 activo. Si ten\u00e9s dudas, escribinos por WhatsApp al ${esc(D.whatsapp)}.</p>`; return;
  }
  if(!g.online){
    app.innerHTML=`<h2>Tu turno</h2>${resumen}<a class="btn wa-btn" href="${waP('Hola Paula! Soy '+g.clienta+'. Quiero consultar por mi turno del '+cuando.toLowerCase()+'.')}" target="_blank" rel="noopener">Escribir por WhatsApp</a>`; return;
  }
  app.innerHTML = `<h2>Hola ${esc(g.clienta.split(' ')[0])}</h2><p class="sub">\u00bfQu\u00e9 quer\u00e9s hacer con tu turno?</p>${resumen}
    <div class="methods">
      ${g.puedeCambiar?`<button class="method" id="g-move"><span class="mtitle">Cambiar d\u00eda u horario</span><span class="note">Tu se\u00f1a se mantiene para el nuevo turno.</span></button>`
        :`<div class="method off"><span class="mtitle">Cambiar d\u00eda u horario</span><span class="note">${g.estadoTurno==='a verificar'?'Pod\u00e9s cambiarlo cuando Paula confirme tu se\u00f1a.':`Faltan menos de ${g.minHoras} h. Para cambiarlo, <a class="walink" href="${waP('Hola Paula! Soy '+g.clienta+'. Necesito cambiar mi turno del '+cuando.toLowerCase()+'.')}" target="_blank" rel="noopener">escribile a Paula</a>.`}</span></div>`}
      <button class="method" id="g-cancel"><span class="mtitle">Cancelar turno</span><span class="note">${devTxt?`Faltan ${g.devuelve?'m\u00e1s':'menos'} de ${g.minHoras} h: ${devTxt}.`:(g.sena||g.regalo)?`Faltan menos de ${g.minHoras} h: no corresponde devoluci\u00f3n.`:'Se libera el horario.'}</span></button>
    </div>`;
  const mv=document.getElementById('g-move');
  if(mv) mv.onclick=()=>{ cargando('Buscando horarios libres\u2026');
    google.script.run.withSuccessHandler(a=>{st.gAvail=a; st.gDay=null; st.step='gmover'; render();})
      .withFailureHandler(e=>{gestion(); error(e);}).getAvailabilityGestion(g.id, g.k); };
  document.getElementById('g-cancel').onclick=()=>gestionCancelar();
}

function gestionCancelar(){
  const g = st.g; const fd = fdate(g.fecha);
  app.innerHTML = `<button class="back" id="b-back">\u2190 Volver</button><h2>\u00bfCancelar tu turno?</h2>
    <p class="sub">${esc(g.servicios)} \u00b7 ${DIAS[fd.getDay()]} ${fd.getDate()} de ${MESL[fd.getMonth()]}, ${g.inicio} h</p>
    <div class="summary"><div class="row total"><span>Devoluci\u00f3n</span><span>${g.dev&&(g.dev.cash||g.dev.regalo)?[g.dev.cash?fmt$(g.dev.cash):'',g.dev.regalo?fmt$(g.dev.regalo)+' a tu tarjeta':''].filter(Boolean).join(' + '):(g.sena||g.regalo)?'No corresponde':'\u2014'}</span></div></div>
    <div class="btnrow"><button class="btn" id="g-yes">S\u00ed, cancelar mi turno</button><button class="btn ghost" id="g-no">No, mantenerlo</button></div>`;
  document.getElementById('b-back').onclick=()=>{st.step='g';render();};
  document.getElementById('g-no').onclick=()=>{st.step='g';render();};
  document.getElementById('g-yes').onclick=()=>{ cargando('Cancelando\u2026');
    google.script.run.withSuccessHandler(r=>{
      app.innerHTML=`<div class="okbox"><h2>Turno cancelado</h2><div>${esc(g.servicios)}</div><div>${r.sena?`Paula te va a devolver <b>${fmt$(r.sena)}</b>.`:''}${r.regalo?` <b>${fmt$(r.regalo)}</b> volvieron a tu tarjeta regalo.`:''}${!r.sena&&!r.regalo?'Seg\u00fan la pol\u00edtica de reservas, no corresponde devoluci\u00f3n.':''}</div><div class="mailnote">\u2709 Te mandamos la confirmaci\u00f3n por correo.</div></div>
        <div class="btnrow"><a class="btn ghost" href="${esc(D.url)}" target="_top">Reservar otro turno</a></div>`;
    }).withFailureHandler(e=>{st.step='g'; render(); error(e);}).gestionarTurno(g.id, g.k, 'cancelar', null); };
}

function gestionMover(){
  const g = st.g; const a = st.gAvail; const dias = a.dias;
  if(!st.gDay){ const d = dias.find(x=>x.libres.length); st.gDay = d ? d.fecha : (dias[0]&&dias[0].fecha); }
  const dia = dias.find(x=>x.fecha===st.gDay) || {libres:[]};
  const fd = st.gDay ? fdate(st.gDay) : null;
  app.innerHTML = `<button class="back" id="b-back">\u2190 Volver</button><h2>Eleg\u00ed el nuevo d\u00eda y hora</h2>
    <p class="sub">${esc(g.servicios)} \u00b7 dura ${durTxt(a.dur)}. Tu turno actual es el ${g.fecha.split('-').reverse().slice(0,2).join('/')} a las ${g.inicio} h.</p>
    ${daysNav(`<div class="days">${dias.map(d=>dayBtn(d, st.gDay)).join('')}</div>`)}
    ${fd&&!dia.cerrado?`<h3>Horarios libres \u00b7 ${DIAS[fd.getDay()]} ${fd.getDate()} de ${MESL[fd.getMonth()]}</h3>`:''}
    ${dia.cerrado ? cerradoBox(dia) : dia.libres.length?slotsHTML(dia.libres):'<p class="note">No quedan horarios este d\u00eda.</p>'}`;
  document.getElementById('b-back').onclick=()=>{st.step='g';render();};
  app.querySelectorAll('.day').forEach(b=>b.onclick=()=>{st.gDay=b.dataset.k; gestionMover();});
  initDays();
  app.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{
    const t=+b.dataset.t; const nd=fdate(st.gDay);
    cargando('Cambiando tu turno\u2026');
    google.script.run.withSuccessHandler(r=>{
      if(!r.ok){ google.script.run.withSuccessHandler(x=>{st.gAvail=x; gestionMover(); error({message:r.msg});}).getAvailabilityGestion(g.id,g.k); return; }
      const f2=fdate(r.fecha);
      app.innerHTML=`<div class="okbox"><h2>\u00a1Turno cambiado!</h2><div>${esc(g.servicios)}</div><div>${DIAS[f2.getDay()]} ${f2.getDate()} de ${MESL[f2.getMonth()]}, de ${r.inicio} a ${r.fin} h</div><div class="mailnote">\u2709 Te mandamos los nuevos datos por correo.</div></div>`;
    }).withFailureHandler(e=>{gestionMover(); error(e);}).gestionarTurno(g.id, g.k, 'mover', {fecha:st.gDay, inicio:t});
  });
}

google.script.run.withSuccessHandler(w=>{
  const d = w.datos; RETORNO = w.retorno || null; aplicarMarca(w.marca); d.url = WEB_PAGE;
  if(location.search) history.replaceState(null, '', WEB_PAGE);
  D=d; document.getElementById('negocio').textContent = d.negocio;
  const tok = SES.get();
  const conSesion = fn => { cargando('Entrando\u2026'); google.script.run.withSuccessHandler(r=>{ if(r && r.ok){ ESP=r.espacio; fn(); } else { SES.clear(); fn(true); } }).withFailureHandler(()=>fn(true)).sesion(tok); };
  if(RETORNO && RETORNO.estado==='codigo'){ st.code=String(RETORNO.codigo||''); st.codeOpen=true; if(tok) conSesion(sin=>{ if(sin) render(); else irAReservar(st.code); }); else render(); }
  else if(RETORNO && RETORNO.estado==='regalar'){ st.step='rg1'; render(); }
  else if(RETORNO && RETORNO.estado==='resena'){ resena(); }
  else if(RETORNO && RETORNO.estado==='regalo-mp'){ regaloMPFinal(RETORNO); }
  else if(RETORNO && RETORNO.estado==='cobro-ok'){ app.innerHTML=`<div class="okbox">${okCheck()}<h2>\u00a1Gracias! Recibimos tu pago</h2><div>Ya qued\u00f3 registrado. \u00a1Gracias por venir! \ud83d\udc9b</div></div><div class="btnrow"><a class="btn ghost" href="${esc(D.url)}" target="_top">Reservar mi pr\u00f3ximo turno</a></div>`; fiesta(); }
  else if(RETORNO && RETORNO.estado==='resena-error'){ app.innerHTML=`<div class="summary"><h2>Este link no es v\u00e1lido</h2><p class="note">Revis\u00e1 que est\u00e9 completo (copialo del correo) o escribinos por WhatsApp.</p></div>`; }
  else if(RETORNO && RETORNO.estado==='ref'){ st.ref=RETORNO.ref; st.refNombre=RETORNO.nombre; render(); }
  else if(RETORNO && RETORNO.estado==='espacio'){ if(RETORNO.token) SES.set(RETORNO.token, true); ESP=RETORNO; espacio(); }
  else if(RETORNO && RETORNO.estado==='espacio-error'){ app.innerHTML=`<div class="summary"><h2>No pudimos abrir tu espacio</h2><p class="note">Revis\u00e1 que el link est\u00e9 completo (copialo del correo) o escribinos por WhatsApp.</p><a class="btn" href="${esc(D.url)}" target="_top">Ir a reservar</a></div>`; }
  else if(RETORNO){ final(RETORNO); }
  else if(tok){ conSesion(sin=>{ if(sin) render(); else espacio(); }); }
  else render();
}).withFailureHandler(e=>{app.innerHTML='';error(e);}).inicioWeb(webParams());
</script>
</body>
